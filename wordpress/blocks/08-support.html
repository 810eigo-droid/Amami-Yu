<!-- 08 自分を整理することは、人を支援する力にもつながる -->

  <div class="lp-inner lp-inner--narrow lp-reveal">
    <h2 class="lp-h2">「自分を整理すること」は、<br>人を支援する力にもつながる。</h2>
    <p>もしあなたが、これまで心理学やコーチングを学んできて、いつか、コーチやカウンセラー、セラピストとして、自分の経験を人の役に立てたいと思っているなら。</p>
    <p>自分自身の「役割」や家族連鎖を整理することには、とても大きな意味があります。</p>
    <p>なぜなら、人を支援するとき、<strong>まずは自分の内が整って、安心感があるかどうかがもっとも大切になる</strong>からです。</p>
