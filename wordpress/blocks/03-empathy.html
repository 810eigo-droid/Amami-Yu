<!-- 03 ミニ講座を見て感じたこと -->
<section class="lp-section lp-section--soft lp-section--bg" style="--lp-bg:url({{LP_IMG}}/bg-03.webp)">
  <div class="lp-inner lp-inner--narrow lp-reveal">
    <figure class="lp-visual"><img src="{{LP_IMG}}/sec-03.webp" width="1536" height="1024" alt="ミニ講座を見ながら考えている女性" loading="lazy"></figure>
    <p>「役割から読み解くミニ講座」を最後までご覧いただき、ありがとうございました。</p>
    <p>講座を見ながら、</p>
    <ul class="lp-voice-list">
      <li>だから私は人のことを優先してしまってきたかもしれない</li>
      <li>親子関係で同じことを繰り返してしまうのは、理由があるのかも…</li>
      <li>ずっと自信が持てなかったことと、子どもの頃の役割はつながっているのかな…</li>
    </ul>
    <p>そんなふうに感じた方もいらっしゃるかもしれません。</p>
    <p>そして、<strong>「では、私の場合はどうなんだろう？」</strong>と思われたのではないでしょうか。</p>
    <p>実際に役割について知ることと、あなたの人生の中で、<span class="lp-mk">その役割がどう働いているのかを理解すること</span>は、少し違います。</p>
  </div>
</section>
